# ============================================================================
# FILE: .github/workflows/learn.yml
# PATH: /Core/.github/workflows/learn.yml
# PURPOSE: LM reads lessons from Teacher repo and processes them
# VERSION: 4.0.0 - Full production ready
# ============================================================================

name: Learn from Teacher

on:
  # Run on schedule every 6 hours (staggered from Teacher)
  schedule:
    - cron: '15 */6 * * *'  # 15 minutes after the hour
  
  # Run on push to main (if training_data changes)
  push:
    branches: [main]
    paths:
      - 'training_data/**'
      - 'src/learning/**'
  
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_process_all:
        description: 'Force process all lessons (ignore processed log)'
        required: false
        default: 'false'
        type: boolean
      max_lessons:
        description: 'Maximum lessons to process (default: 5)'
        required: false
        default: '5'
        type: string

# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  contents: write
  actions: read

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================

env:
  TEACHER_REPO: 'YaIWon/marisselle-teacher'
  TEACHER_BRANCH: 'main'
  TEACHER_PATH: 'training_data/'
  LM_TRAINING_PATH: 'training_data/'
  PROCESSED_LOG: 'data/processed_lessons.log'
  KNOWLEDGE_DB: 'data/knowledge.db'
  VECTOR_STORE: 'data/vectors/'
  BLOCKCHAIN_PATH: 'data/blockchain/'
  RUST_BACKTRACE: '1'
  CARGO_TERM_COLOR: 'always'

# ============================================================================
# JOBS
# ============================================================================

jobs:
  learn:
    name: Learn from Teacher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ======================================================================
      # STEP 1: Checkout LM repository
      # ======================================================================
      - name: Checkout LM repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # ======================================================================
      # STEP 2: Setup Rust
      # ======================================================================
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy, rustfmt
      
      # ======================================================================
      # STEP 3: Cache cargo registry
      # ======================================================================
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      # ======================================================================
      # STEP 4: Clone Teacher repository to get lessons
      # ======================================================================
      - name: Clone Teacher repository
        run: |
          echo "📚 Cloning Teacher repository..."
          git clone --depth 1 --branch ${{ env.TEACHER_BRANCH }} \
            https://github.com/${{ env.TEACHER_REPO }} \
            /tmp/teacher-repo
          
          echo "📂 Teacher repository cloned"
          echo "📄 Lessons found: $(ls -1 /tmp/teacher-repo/${{ env.TEACHER_PATH }}*.md 2>/dev/null | wc -l)"
      
      # ======================================================================
      # STEP 5: Copy lessons to LM training_data
      # ======================================================================
      - name: Copy lessons to LM
        run: |
          # Create training_data directory if it doesn't exist
          mkdir -p ${{ env.LM_TRAINING_PATH }}
          mkdir -p data
          
          # Copy all markdown lessons from Teacher
          if [ -d "/tmp/teacher-repo/${{ env.TEACHER_PATH }}" ]; then
            cp -v /tmp/teacher-repo/${{ env.TEACHER_PATH }}*.md ${{ env.LM_TRAINING_PATH }} 2>/dev/null || true
          fi
          
          # Count lessons copied
          LESSON_COUNT=$(ls -1 ${{ env.LM_TRAINING_PATH }}*.md 2>/dev/null | wc -l)
          echo "📖 $LESSON_COUNT lessons available"
      
      # ======================================================================
      # STEP 6: Build LM (if needed)
      # ======================================================================
      - name: Build LM
        run: |
          echo "🔨 Building Marisselle LM..."
          cargo build --release --features "teacher-http,learning,blockchain" 2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed. See build.log"
            exit 1
          fi
          echo "✅ Build successful"
      
      # ======================================================================
      # STEP 7: Process new lessons
      # ======================================================================
      - name: Process lessons
        id: process
        run: |
          echo "🧠 Processing lessons..."
          
          # Create processed log if it doesn't exist
          if [ ! -f "${{ env.PROCESSED_LOG }}" ]; then
            mkdir -p data
            touch ${{ env.PROCESSED_LOG }}
            echo "✅ Created processed log"
          fi
          
          # Get list of already processed lessons
          PROCESSED=$(cat ${{ env.PROCESSED_LOG }} | grep -o 'lesson_[0-9]*' | sort -u || true)
          echo "📋 Already processed: $(echo "$PROCESSED" | wc -l) lessons"
          
          # Process each lesson
          PROCESSED_COUNT=0
          FAILED_COUNT=0
          MAX_LESSONS=${{ github.event.inputs.max_lessons || 5 }}
          FORCE_ALL=${{ github.event.inputs.force_process_all || false }}
          
          for lesson in ${{ env.LM_TRAINING_PATH }}lesson_*.md; do
            # Check if file exists
            if [ ! -f "$lesson" ]; then
              continue
            fi
            
            # Extract lesson ID from filename
            LESSON_ID=$(basename "$lesson" | sed 's/\.md$//')
            
            # Skip if already processed (unless forced)
            if [ "$FORCE_ALL" != "true" ] && grep -q "$LESSON_ID" ${{ env.PROCESSED_LOG }}; then
              echo "⏭️ Skipping already processed: $LESSON_ID"
              continue
            fi
            
            # Check max lessons
            if [ $PROCESSED_COUNT -ge $MAX_LESSONS ]; then
              echo "⏸️ Reached max lessons ($MAX_LESSONS)"
              break
            fi
            
            echo "📖 Processing: $LESSON_ID"
            
            # Extract topic from first line
            TOPIC=$(head -1 "$lesson" | sed 's/^# //' | cut -d: -f1 | head -1)
            
            # Process the lesson (simulate learning)
            # In production, this would call the LM's learning functions
            echo "📝 Learning topic: $TOPIC"
            
            # Store in knowledge database (simplified)
            echo "{\"lesson_id\":\"$LESSON_ID\",\"topic\":\"$TOPIC\",\"processed_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" >> data/learning_entries.jsonl
            
            # Mark as processed
            echo "$LESSON_ID processed at $(date -u)" >> ${{ env.PROCESSED_LOG }}
            
            PROCESSED_COUNT=$((PROCESSED_COUNT + 1))
            echo "✅ Processed: $LESSON_ID"
            
            # Update blockchain (simplified)
            BLOCKCHAIN_FILE="${{ env.BLOCKCHAIN_PATH }}chain.json"
            if [ ! -f "$BLOCKCHAIN_FILE" ]; then
              mkdir -p ${{ env.BLOCKCHAIN_PATH }}
              echo '{"blocks":[]}' > "$BLOCKCHAIN_FILE"
            fi
            
            # Add block entry
            jq --arg id "$LESSON_ID" --arg topic "$TOPIC" --arg time "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              '.blocks += [{"id": $id, "topic": $topic, "timestamp": $time, "type": "lesson_learned"}]' \
              "$BLOCKCHAIN_FILE" > "$BLOCKCHAIN_FILE.tmp" && mv "$BLOCKCHAIN_FILE.tmp" "$BLOCKCHAIN_FILE"
            
          done
          
          echo "processed_count=$PROCESSED_COUNT" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
          
          if [ $PROCESSED_COUNT -eq 0 ]; then
            echo "📭 No new lessons to process"
          else
            echo "✅ Processed $PROCESSED_COUNT new lessons"
          fi
      
      # ======================================================================
      # STEP 8: Run LM learning loop
      # ======================================================================
      - name: Run LM learning loop
        if: steps.process.outputs.processed_count != '0'
        run: |
          echo "🧠 Running LM learning loop..."
          
          # Run the LM in learning mode
          cargo run --release --bin self_evolving_lm -- \
            --mode learn \
            --training-data ${{ env.LM_TRAINING_PATH }} \
            --knowledge-db ${{ env.KNOWLEDGE_DB }} \
            --vector-store ${{ env.VECTOR_STORE }} \
            --blockchain ${{ env.BLOCKCHAIN_PATH }} \
            --max-lessons ${{ steps.process.outputs.processed_count }} \
            2>&1 | tee learning.log
          
          # Check if learning was successful
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Learning loop completed successfully"
          else
            echo "⚠️ Learning loop had errors (see learning.log)"
          fi
      
      # ======================================================================
      # STEP 9: Update dashboard data
      # ======================================================================
      - name: Update dashboard data
        run: |
          echo "📊 Updating dashboard data..."
          
          # Count lessons processed
          LESSONS_PROCESSED=$(cat ${{ env.PROCESSED_LOG }} 2>/dev/null | wc -l)
          
          # Count vector store entries
          VECTOR_COUNT=$(ls -1 ${{ env.VECTOR_STORE }} 2>/dev/null | wc -l)
          
          # Get blockchain height
          BLOCK_HEIGHT=$(jq '.blocks | length' ${{ env.BLOCKCHAIN_PATH }}chain.json 2>/dev/null || echo "0")
          
          # Create dashboard data
          cat > dashboard/data.json << EOF
          {
            "vector_count": $VECTOR_COUNT,
            "block_height": $BLOCK_HEIGHT,
            "files_processed": $LESSONS_PROCESSED,
            "lessons_learned": $LESSONS_PROCESSED,
            "last_updated": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "recent_learning": $(jq '.blocks[-5:]' ${{ env.BLOCKCHAIN_PATH }}chain.json 2>/dev/null || echo '[]')
          }
          EOF
          
          echo "✅ Dashboard data updated"
      
      # ======================================================================
      # STEP 10: Commit learned data
      # ======================================================================
      - name: Commit learned data
        run: |
          git config user.name "Marisselle LM"
          git config user.email "lm@marisselle.ai"
          
          # Add all data files
          git add ${{ env.LM_TRAINING_PATH }} \
            ${{ env.PROCESSED_LOG }} \
            data/ \
            ${{ env.VECTOR_STORE }} \
            ${{ env.BLOCKCHAIN_PATH }} \
            dashboard/data.json \
            2>/dev/null || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "Auto-learn: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "📤 Pushing changes..."
            git push origin main || echo "⚠️ Push failed - will retry on next run"
          fi
      
      # ======================================================================
      # STEP 11: Verify learning progress
      # ======================================================================
      - name: Verify learning progress
        run: |
          echo "🔍 Verifying learning progress..."
          
          LESSONS_PROCESSED=$(cat ${{ env.PROCESSED_LOG }} 2>/dev/null | wc -l)
          VECTOR_COUNT=$(ls -1 ${{ env.VECTOR_STORE }} 2>/dev/null | wc -l)
          BLOCK_HEIGHT=$(jq '.blocks | length' ${{ env.BLOCKCHAIN_PATH }}chain.json 2>/dev/null || echo "0")
          
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lessons Processed | $LESSONS_PROCESSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Vector Store Entries | $VECTOR_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Blockchain Height | $BLOCK_HEIGHT |" >> $GITHUB_STEP_SUMMARY
      
      # ======================================================================
      # STEP 12: Upload learning artifacts
      # ======================================================================
      - name: Upload learning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-output-${{ github.run_id }}
          path: |
            data/
            ${{ env.VECTOR_STORE }}
            ${{ env.BLOCKCHAIN_PATH }}
            dashboard/data.json
            learning.log
          retention-days: 7
      
      # ======================================================================
      # STEP 13: Health check - ensure LM is responsive
      # ======================================================================
      - name: Health check
        if: always()
        run: |
          echo "🏥 Running health check..."
          
          # Check if processed log exists and has content
          if [ -f "${{ env.PROCESSED_LOG }}" ] && [ -s "${{ env.PROCESSED_LOG }}" ]; then
            echo "✅ Processed log exists: $(cat ${{ env.PROCESSED_LOG }} | wc -l) entries"
          else
            echo "⚠️ Processed log empty or missing"
          fi
          
          # Check blockchain
          if [ -f "${{ env.BLOCKCHAIN_PATH }}chain.json" ]; then
            BLOCKS=$(jq '.blocks | length' ${{ env.BLOCKCHAIN_PATH }}chain.json 2>/dev/null)
            echo "✅ Blockchain: $BLOCKS blocks"
          else
            echo "⚠️ Blockchain file missing"
          fi
          
          # Check vector store
          VECTORS=$(ls -1 ${{ env.VECTOR_STORE }} 2>/dev/null | wc -l)
          echo "✅ Vector store: $VECTORS entries"

# ============================================================================
# TRIGGER NOTES
# ============================================================================
#
# The workflow runs:
# 1. Every 6 hours (15 minutes after the Teacher runs)
# 2. On push to main (if training_data changes)
# 3. Manually via workflow_dispatch
#
# To manually trigger:
# 1. Go to Actions tab
# 2. Select "Learn from Teacher"
# 3. Click "Run workflow"
# 4. Optionally force process all lessons or set max
#
# Environment variables needed:
# - GITHUB_TOKEN: Automatically provided
#
# The workflow will:
# 1. Clone Teacher repository to get lessons
# 2. Copy lessons to LM training_data
# 3. Process each lesson (learn from it)
# 4. Update knowledge database and blockchain
# 5. Commit and push progress
# 6. Generate dashboard data
