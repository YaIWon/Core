# ============================================================================
# FILE: .github/workflows/marisselle.yml
# COMBINED WORKFLOW: Dashboard + Continuous Learning + Teacher Integration
# WITH PAGES ENABLEMENT
# ============================================================================

name: Marisselle - Dashboard & Learning

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'training_data/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_dashboard:
        description: 'Skip dashboard deployment'
        required: false
        default: false
        type: boolean

# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================

env:
  TEACHER_ENDPOINT: "https://yaiwon.github.io/marisselle-teacher/api/teacher/ask"
  TEACHER_STATUS: "https://yaiwon.github.io/marisselle-teacher/api/teacher/status"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: false

# ============================================================================
# JOBS
# ============================================================================

jobs:
  # ========================================================================
  # JOB 0: ENABLE PAGES (if not already enabled)
  # ========================================================================
  
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    
    steps:
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          generator_config_file: .github/workflows/marisselle.yml

  # ========================================================================
  # JOB 1: DASHBOARD DEPLOYMENT
  # ========================================================================
  
  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: [enable-pages]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_dashboard != 'true'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Build dashboard with Teacher status
        run: |
          mkdir -p dashboard
          
          cat > dashboard/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Self-Evolving LM Dashboard</title>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #0a0a0a; color: #e0e0e0; }
                  .container { max-width: 1200px; margin: 0 auto; }
                  h1 { color: #00ff88; }
                  .card { background: #1a1a1a; border-radius: 8px; padding: 20px; margin: 20px 0; border: 1px solid #333; }
                  .stat { font-size: 2em; font-weight: bold; color: #00ff88; }
                  table { width: 100%; border-collapse: collapse; }
                  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
                  th { color: #888; }
                  .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
                  .status.online { background: #00ff88; box-shadow: 0 0 5px #00ff88; }
                  .status.offline { background: #ff4444; }
                  .teacher-status { margin-left: 10px; font-size: 0.6em; }
                  .teacher-online { color: #00ff88; }
                  .teacher-offline { color: #ff4444; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🧠 Self-Evolving LM Dashboard
                      <span id="teacher-badge" class="teacher-status">[Checking Teacher...]</span>
                  </h1>
                  
                  <div class="card">
                      <h2>👨‍🏫 Teacher Status</h2>
                      <div id="teacher-status">
                          <p>Checking Teacher availability...</p>
                      </div>
                  </div>
                  
                  <div class="card">
                      <h2>System Status</h2>
                      <p><span class="status online"></span> Online</p>
                      <p>Last updated: <span id="timestamp"></span></p>
                  </div>
                  
                  <div class="card">
                      <h2>Statistics</h2>
                      <p>Vector Store Entries: <span class="stat" id="vector_count">---</span></p>
                      <p>Blockchain Height: <span class="stat" id="block_height">---</span></p>
                      <p>Files Processed: <span class="stat" id="files_processed">---</span></p>
                      <p>Teacher Tokens: <span class="stat" id="teacher_tokens">---</span></p>
                  </div>
                  
                  <div class="card">
                      <h2>Recent Learning</h2>
                      <table id="learning-table">
                          <thead><tr><th>Time</th><th>Content</th></tr></thead>
                          <tbody></tbody>
                      </table>
                  </div>
              </div>
              
              <script>
                  const TEACHER_API = '${{ env.TEACHER_STATUS }}';
                  
                  async function checkTeacher() {
                      const statusDiv = document.getElementById('teacher-status');
                      const badge = document.getElementById('teacher-badge');
                      try {
                          const response = await fetch(TEACHER_API);
                          if (response.ok) {
                              const data = await response.json();
                              if (data.online) {
                                  badge.innerHTML = '[Teacher: ONLINE]';
                                  badge.className = 'teacher-status teacher-online';
                                  statusDiv.innerHTML = '<p>✅ Teacher is online and ready</p><p>Model: ' + (data.model || 'Groq Mixtral') + '</p>';
                                  if (data.metrics && data.metrics.totalTokens) {
                                      document.getElementById('teacher_tokens').innerText = data.metrics.totalTokens;
                                  }
                              } else {
                                  badge.innerHTML = '[Teacher: OFFLINE]';
                                  badge.className = 'teacher-status teacher-offline';
                                  statusDiv.innerHTML = '<p>⚠️ Teacher is offline</p>';
                              }
                          } else {
                              badge.innerHTML = '[Teacher: ERROR]';
                              badge.className = 'teacher-status teacher-offline';
                              statusDiv.innerHTML = '<p>⚠️ Teacher API error: ' + response.status + '</p>';
                          }
                      } catch(e) {
                          badge.innerHTML = '[Teacher: UNREACHABLE]';
                          badge.className = 'teacher-status teacher-offline';
                          statusDiv.innerHTML = '<p>⚠️ Teacher unreachable: ' + e.message + '</p>';
                      }
                  }
                  
                  async function fetchData() {
                      try {
                          const response = await fetch("data.json");
                          const data = await response.json();
                          document.getElementById("timestamp").innerText = new Date().toLocaleString();
                          document.getElementById("vector_count").innerText = data.vector_count || 0;
                          document.getElementById("block_height").innerText = data.block_height || 0;
                          document.getElementById("files_processed").innerText = data.files_processed || 0;
                          const tbody = document.querySelector("#learning-table tbody");
                          tbody.innerHTML = "";
                          if (data.recent_learning) {
                              data.recent_learning.forEach(item => {
                                  const row = tbody.insertRow();
                                  row.insertCell(0).innerText = item.time;
                                  row.insertCell(1).innerText = item.content;
                              });
                          }
                      } catch(e) { console.error(e); }
                  }
                  
                  checkTeacher();
                  fetchData();
                  setInterval(fetchData, 30000);
                  setInterval(checkTeacher, 60000);
              </script>
          </body>
          </html>
          EOF
          
          echo '{"vector_count":0,"block_height":0,"files_processed":0,"recent_learning":[]}' > dashboard/data.json
          echo "Dashboard built successfully"
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ========================================================================
  # JOB 2: CONTINUOUS LEARNING
  # ========================================================================
  
  continuous-learning:
    runs-on: ubuntu-latest
    needs: [enable-pages]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check Teacher availability
        id: teacher-check
        run: |
          TEACHER_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.TEACHER_STATUS }}" || echo "000")
          if [ "$TEACHER_RESPONSE" = "200" ]; then
            echo "✅ Teacher is AVAILABLE"
            echo "teacher_available=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Teacher is UNAVAILABLE (HTTP $TEACHER_RESPONSE)"
            echo "teacher_available=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release --features "teacher-http"
      
      - name: Run learning process
        run: |
          mkdir -p data/vectors data/blockchain training_data/.questions training_data/.answers config
          
          # Create teacher config
          cat > config/teacher.toml << 'TOML'
          [teacher]
          enabled = true
          provider = "groq"
          method = "http"
          endpoint = "${{ env.TEACHER_ENDPOINT }}"
          status_endpoint = "${{ env.TEACHER_STATUS }}"
          timeout_seconds = 60
          max_retries = 3
          TOML
          
          cargo run --release --bin self_evolving_lm &
          LEARNING_PID=$!
          sleep 15
          kill $LEARNING_PID 2>/dev/null || true
          wait $LEARNING_PID 2>/dev/null || true
      
      - name: Commit learned data
        run: |
          git config user.name "Marisselle LM"
          git config user.email "marisselle@yaiwon.github.io"
          git add data/ vectors/ blockchain.json config/teacher.toml 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-learn: $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push || true
