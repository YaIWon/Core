# ======================================================================
# FILE: Cargo.toml
# PATH: /workspaces/Core/Cargo.toml
# PURPOSE: Complete dependency manifest for Marisselle self-evolving LM
#          MERGED: All original dependencies + new mining/web/security crates
#          Includes: blockchain, mining (RandomX/Stratum), web server (Axum),
#          encryption (AES-GCM), wallet generation, full system access.
#          HTTP client (reqwest) for Teacher communication.
#          teacher-http enabled by default.
#          Zero limitations. Production ready.
# ======================================================================

[package]
name = "self_evolving_lm"
version = "3.0.0"
edition = "2021"
authors = ["Elder Robert William Henley <did.not.think.of.this@gmail.com>"]
description = "Marisselle - Self-Evolving Language Model with Real Mining and Blockchain"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YaIWon/Core"
readme = "README.md"

[lib]
name = "self_evolving_lm"
path = "src/lib.rs"

[[bin]]
name = "self_evolving_lm"
path = "src/main.rs"

[[bin]]
name = "marisselle"
path = "src/main.rs"

[[bin]]
name = "marisselle_daemon"
path = "src/bin/marisselle_daemon.rs"

[[bin]]
name = "chat"
path = "src/bin/chat.rs"

[[bin]]
name = "teacher"
path = "src/bin/teacher.rs"

[[bin]]
name = "train_amoral"
path = "src/bin/train_amoral.rs"

[[bin]]
name = "view_logs"
path = "src/bin/view_logs.rs"

[[bin]]
name = "generate_wallet"
path = "src/bin/generate_wallet.rs"

[[bin]]
name = "show_vault"
path = "src/bin/show_vault.rs"

# ======================================================================
# PROFILES
# ======================================================================

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

# ======================================================================
# DEPENDENCIES - CORE (Original + New)
# ======================================================================

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing", "signal", "rt-multi-thread"] }
tokio-util = "0.7"
futures = "0.3"
futures-util = { version = "0.3", features = ["sink", "std"] }

# Tracing & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
backtrace = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rmp-serde = "1.1"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

# Time and dates
chrono = { version = "0.4", features = ["serde", "clock"] }
time = "0.3"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }

# File system
walkdir = "2.4"
glob = "0.3"
tempfile = "3.8"
fs_extra = "1.3"
ignore = "0.4"
dirs = "5.0"
which = "5.0"

# Environment
dotenv = "0.15"

# Async traits
async-trait = "0.1"

# Colors
colored = "2.0"
once_cell = "1.19"
lazy_static = "1.4"

# ======================================================================
# DEPENDENCIES - MACHINE LEARNING & MODEL
# ======================================================================

# Candle (ML framework) - Using git for latest features
candle-core = { git = "https://github.com/huggingface/candle", features = ["accelerate", "cuda"] }
candle-nn = { git = "https://github.com/huggingface/candle" }
candle-transformers = { git = "https://github.com/huggingface/candle" }
half = "2.4"

# Tokenizers
tokenizers = { version = "0.19", features = ["http"] }

# BLAS/Linear algebra
ndarray = { version = "0.15", features = ["rayon", "serde"] }
ndarray-rand = "0.14"

# ======================================================================
# DEPENDENCIES - FILE WATCHING (Original)
# ======================================================================

notify = { version = "6.1", features = ["macos_fsevent", "macos_kqueue"] }
notify-debouncer-mini = "0.4"

# ======================================================================
# DEPENDENCIES - FILE PARSING (Original)
# ======================================================================

pdf-extract = "0.6"
lopdf = "0.31"
docx-rs = "0.7"
zip = { version = "1.1", features = ["deflate", "bzip2", "zstd", "aes", "lzma"] }
tar = "0.4"
flate2 = { version = "1.0", features = ["zlib", "rust_backend"] }
tesseract = "0.15"
image = { version = "0.24", features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "pnm"] }
regex = "1.10"

# ======================================================================
# DEPENDENCIES - DATABASE / STORAGE (Original + New)
# ======================================================================

heed = { version = "0.20", features = ["lmdb", "serde-json", "derive"] }
lmdb-rkv = "0.14"
sled = "0.34"

# Compression
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
zstd = "0.13"

# ======================================================================
# DEPENDENCIES - BLOCKCHAIN & CRYPTO (Original + New)
# ======================================================================

# Bitcoin
bitcoin = { version = "0.32", features = ["rand", "serde", "secp-lowmemory", "secp-recovery"] }
bitcoincore-rpc = "0.18"
secp256k1 = { version = "0.28", features = ["rand", "serde"] }

# Ethereum
ethers = { version = "2.0", features = ["rustls", "ws", "ipc"] }
ethers-core = "2.0"
ethers-providers = "2.0"
ethers-signers = "2.0"

# Solana
solana-client = "1.18"
solana-sdk = "1.18"

# Monero (RandomX) - Optional for now
randomx = { version = "1.2", optional = true }
monero = { version = "0.18", optional = true }
monero-rpc = { version = "0.18", optional = true }

# General crypto (Original)
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
base64 = { version = "0.21", features = ["std", "alloc"] }

# New crypto for vault/wallets
ripemd = "0.1"
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
aes = "0.8"
ctr = "0.9"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
hkdf = "0.12"
scrypt = "0.11"
argon2 = "0.5"

# Encoding
bs58 = "0.5"
bech32 = "0.9"

# ======================================================================
# DEPENDENCIES - WEB SERVER & NETWORKING (New)
# ======================================================================

# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros", "tracing"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip"] }
tower-lsp = "0.20"
hyper = { version = "1.0", features = ["full"] }
hyper-tls = "0.6"
hyper-rustls = "0.27"

# WebSockets
tokio-tungstenite = { version = "0.21", features = ["native-tls", "rustls-tls"] }
tungstenite = "0.21"

# HTTP client for Teacher communication (UPDATED with full features)
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "multipart",
    "socks",
    "gzip",
    "brotli",
    "native-tls",
    "rustls-tls",
    "cookies",
    "blocking",
] }

# URL handling
url = { version = "2.5", features = ["serde"] }

# Listenfd for graceful reload
listenfd = { version = "1.0", optional = true }

# ======================================================================
# DEPENDENCIES - SYSTEM ACCESS (Original + New)
# ======================================================================

# System info
hostname = "0.3"
whoami = "1.5"
dirs = "5.0"
sysinfo = "0.30"
procfs = "0.16"
num_cpus = "1.16"

# Process management
duct = "0.13"
subprocess = "0.2"
signal-hook = "0.3"
ctrlc = { version = "3.4", features = ["termination"] }

# Device detection
serialport = "4.3"
libusb = "0.3"

# ======================================================================
# DEPENDENCIES - BLUETOOTH (Linux only - Original)
# ======================================================================

[target.'cfg(target_os = "linux")'.dependencies]
bluer = "0.16"

# ======================================================================
# DEPENDENCIES - SHARED MEMORY (Unix only - Original)
# ======================================================================

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"
nix = { version = "0.28", features = [
    "fs",
    "mman",
    "signal",
    "process",
    "mount",
    "user",
    "net",
    "poll",
    "term",
    "time",
    "uio",
] }
parking_lot = "0.12"
libc = "0.2"

# ======================================================================
# DEPENDENCIES - PARALLEL PROCESSING (Original)
# ======================================================================

rayon = "1.8"
crossbeam = "0.8"

# ======================================================================
# DEPENDENCIES - UTILITIES (New)
# ======================================================================

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env", "string"] }
dialoguer = "0.11"
indicatif = "0.17"

# UUID and IDs
nanoid = "0.4"

# Human time formatting
humantime = "2.1"

# URL slug
slug = "0.1"

# Email
lettre = { version = "0.11", features = ["smtp-transport", "builder", "tokio1-native-tls"] }

# JSON processing
json = "0.12"
jq = "0.2"

# ======================================================================
# OPTIONAL DEPENDENCIES & FEATURES
# ======================================================================

[features]
default = ["full", "web", "stratum", "teacher-http"]
full = ["mining", "gpu", "hardware"]
mining = ["randomx", "monero", "monero-rpc"]
gpu = []
hardware = ["bluer"]
web = []
stratum = []
teacher-http = ["reqwest"]
test = []

# ======================================================================
# DEV DEPENDENCIES
# ======================================================================

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
test-case = "3.3"
proptest = "1.4"
pretty_assertions = "1.4"

[[bench]]
name = "mining_bench"
harness = false

# ======================================================================
# PROFILE CONFIGURATION
# ======================================================================

[profile.release.package.candle-core]
opt-level = 3

[profile.release.package.randomx]
opt-level = 3
debug = false

# ======================================================================
# BUILD CONFIGURATION
# ======================================================================

[build]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-args=-Wl,-rpath,$ORIGIN",
]
